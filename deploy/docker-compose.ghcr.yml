services:
  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:?set IMAGE_OWNER}/dujiao-next-server:${IMAGE_TAG:-main}
    command: ["./dujiao-api", "-mode", "api"]
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "${SERVER_MODE:-release}"
      DATABASE_DRIVER: "${DATABASE_DRIVER:-postgres}"
      DATABASE_DSN: "${DATABASE_DSN:?set DATABASE_DSN to the Supabase Postgres connection string}"
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      QUEUE_ENABLED: "${QUEUE_ENABLED:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:?set CORS_ALLOWED_ORIGINS to the Vercel frontend origins}"
      CORS_ALLOWED_HEADERS: "${CORS_ALLOWED_HEADERS:-Content-Type,Content-Length,Accept,Accept-Encoding,Authorization,Cache-Control,X-Requested-With,X-CSRF-Token,X-Request-ID,X-Lang}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-true}"
      EMAIL_ENABLED: "${EMAIL_ENABLED:-false}"
      EMAIL_HOST: "${EMAIL_HOST:-}"
      EMAIL_PORT: "${EMAIL_PORT:-465}"
      EMAIL_USERNAME: "${EMAIL_USERNAME:-}"
      EMAIL_PASSWORD: "${EMAIL_PASSWORD:-}"
      EMAIL_FROM: "${EMAIL_FROM:-}"
      EMAIL_FROM_NAME: "${EMAIL_FROM_NAME:-}"
      DJ_DEFAULT_ADMIN_USERNAME: "${DJ_DEFAULT_ADMIN_USERNAME:-admin}"
      DJ_DEFAULT_ADMIN_PASSWORD: "${DJ_DEFAULT_ADMIN_PASSWORD:?set DJ_DEFAULT_ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      USER_JWT_SECRET: "${USER_JWT_SECRET:?set USER_JWT_SECRET}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:?set APP_SECRET_KEY}"
    volumes:
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

volumes:
  server-uploads:
  server-logs:
