services:
  server:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:?set IMAGE_OWNER}/dujiao-next-server:${IMAGE_TAG:-main}
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      SERVER_MODE: "${SERVER_MODE:-release}"
      DATABASE_DRIVER: "sqlite"
      DATABASE_DSN: "/app/db/dujiao.db"
      REDIS_ENABLED: "${REDIS_ENABLED:-false}"
      QUEUE_ENABLED: "${QUEUE_ENABLED:-false}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      CORS_ALLOW_CREDENTIALS: "${CORS_ALLOW_CREDENTIALS:-false}"
      DJ_DEFAULT_ADMIN_USERNAME: "${DJ_DEFAULT_ADMIN_USERNAME:-admin}"
      DJ_DEFAULT_ADMIN_PASSWORD: "${DJ_DEFAULT_ADMIN_PASSWORD:?set DJ_DEFAULT_ADMIN_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      USER_JWT_SECRET: "${USER_JWT_SECRET:?set USER_JWT_SECRET}"
      APP_SECRET_KEY: "${APP_SECRET_KEY:?set APP_SECRET_KEY}"
    volumes:
      - server-db:/app/db
      - server-uploads:/app/uploads
      - server-logs:/app/logs
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12

  user:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:?set IMAGE_OWNER}/dujiao-next-user:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${USER_PORT:-5173}:80"

  admin:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER:?set IMAGE_OWNER}/dujiao-next-admin:${IMAGE_TAG:-main}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${ADMIN_PORT:-5174}:80"

volumes:
  server-db:
  server-uploads:
  server-logs:
